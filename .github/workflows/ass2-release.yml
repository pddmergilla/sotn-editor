name: Publish ASS 2.0 downloads

on:
  push:
    branches: [main]
    paths:
      - ass2/Alternate-Scarlet-Symphony-2.0.ppf
      - ass2/ass2-release.js
      - ass2-downloads.js
      - tools/ass2/publish-release.js
      - .github/workflows/ass2-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ass2-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'pddmergilla/sotn-editor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check download tracking
        run: node tests/ass2-downloads.test.js
      - name: Publish the numbered patch
        run: node tools/ass2/publish-release.js
        env:
          GH_TOKEN: ${{ github.token }}
