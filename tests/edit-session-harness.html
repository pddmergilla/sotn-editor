<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Saved edits browser check</title>
<p>Loading the editor check…</p>
<script>
  fetch("../index.html").then(response => response.text()).then(html => {
    const setup = `<base href="../"><script>
      window.showOpenFilePicker = undefined;
      window.alert = message => { document.getElementById('checkNotice').textContent = message; };
      window.confirm = () => true;
      window.showSaveFilePicker = async ({suggestedName}) => ({
        isSameEntry: async () => false,
        createWritable: async () => ({
          write: async blob => {
            const output = document.getElementById('savedOutput');
            output.value = blob.type === 'application/json' ? await blob.text() : 'BIN export: ' + blob.size + ' bytes';
            document.getElementById('savedName').textContent = suggestedName;
          }, close: async () => {}
        })
      });
      document.addEventListener('DOMContentLoaded', () => {
        const panel = document.createElement('section');
        panel.innerHTML = '<h2>Saved edits browser check</h2><label><input id="lostAccess" type="checkbox"> Simulate lost BIN access</label><p id="checkNotice"></p><p id="savedName"></p><label>Captured output <textarea id="savedOutput" rows="3" style="width:100%"></textarea></label>';
        document.body.appendChild(panel);
        const original = SotnCore.DiscImage.open;
        SotnCore.DiscImage.open = async file => {
          const disc = await original.call(SotnCore.DiscImage, file), slice = file.slice.bind(file);
          file.slice = (...args) => {
            if (document.getElementById('lostAccess').checked) return {arrayBuffer:async () => {throw new Error('The requested file could not be read.');}};
            return slice(...args);
          };
          return disc;
        };
      });
    <\/script>`;
    document.open(); document.write(html.replace('<head>', '<head>' + setup)); document.close();
  });
</script>
</html>
